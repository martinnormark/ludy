[package]
name = "ludy-cli"
description = "Headless Ludy: create drives, upload, and mount a drive from the terminal"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ludy"
path = "src/main.rs"

[dependencies]
ludy-core = { path = "../ludy-core" }
ludy-proto = { path = "../ludy-proto" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
