[package]
name = "ludy-core"
description = "Ludy's engine: cloud client, block cache, drive filesystem, loopback NFS mount"
version.workspace = true
edition.workspace = true

[dependencies]
ludy-cloud = { path = "../ludy-cloud" }
nfsserve = "0.11"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
