[package]
name = "ludy-core"
description = "Ludy's engine: cloud client, block cache, drive filesystem; with the `mount` feature, the loopback NFS mount"
version.workspace = true
edition.workspace = true

[features]
default = ["mount"]
# The macOS side: the loopback NFS server, mounting it, and the desktop
# `Engine` that owns the mounts. Without it the crate is the portable part
# (client, cache, drive filesystem, patch planner) and builds no NFS code.
mount = ["dep:nfsserve", "dep:async-trait", "dep:libc"]

[dependencies]
ludy-proto = { path = "../ludy-proto" }
nfsserve = { version = "0.11", optional = true }
async-trait = { version = "0.1", optional = true }
libc = { version = "0.2", optional = true }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
ludy-cloud = { path = "../ludy-cloud" }
tempfile = "3"
