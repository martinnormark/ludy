[package]
name = "ludy-cloud"
description = "Simulated cloud: an S3-like object store on localhost with latency, throttling and a range log"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "ludy-cloud"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
bytes = "1"
fastcdc = "3"
sha2 = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
tempfile = "3"
