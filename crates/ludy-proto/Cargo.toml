[package]
name = "ludy-proto"
description = "What a Ludy client and the cloud agree on: the JSON types on the wire, and how file content is cut into shards"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastcdc = "3"
sha2 = "0.10"
# Encryption (`crypt`). No system RNG: chacha20poly1305's default `getrandom`
# feature is off so the crate still builds for wasm32-unknown-unknown.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
hmac = "0.12"
zeroize = "1"
unicode-normalization = "0.1"
