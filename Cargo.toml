[workspace]
resolver = "2"
members = ["crates/*", "providers/rivet"]
# `cargo build` and `cargo test` leave the Rivet provider alone: it is a
# large build. Ask for it with `-p ludy-rivet`. The Cloudflare provider
# (providers/cloudflare) only builds for WebAssembly and is a workspace of its own.
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev]
debug = false
incremental = false

[profile.dev.package."*"]
opt-level = 1
